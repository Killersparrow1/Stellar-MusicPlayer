<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StellarSound | Glassmorphic Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/iconfont/tabler-icons.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-shadow: rgba(0, 0, 0, 0.1);
            --primary-accent: rgba(126, 87, 254, 0.6);
            --secondary-accent: rgba(253, 106, 209, 0.6);
            --font-primary: 'Inter', sans-serif;
            --font-display: 'Plus Jakarta Sans', sans-serif;
            --text-base: 16px;
            --text-scale: 1.25;
            --text-xs: calc(var(--text-base) / var(--text-scale));
            --text-sm: calc(var(--text-base) * var(--text-scale));
            --text-md: calc(var(--text-sm) * var(--text-scale));
            --text-lg: calc(var(--text-md) * var(--text-scale));
            --text-xl: calc(var(--text-lg) * var(--text-scale));
            --text-2xl: calc(var(--text-xl) * var(--text-scale));
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-primary);
            font-size: var(--text-base);
            line-height: 1.6;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-panel {
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: var(--glass-bg);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 var(--glass-shadow);
            padding: 24px;
            width: 85%;
            max-width: 1200px;
        }
        
        .player-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        @media (max-width: 900px) {
            .player-container {
                grid-template-columns: 1fr;
            }
        }
        
        h1, h2, h3, h4 {
            font-family: var(--font-display);
            font-weight: 700;
            line-height: 1.2;
        }
        
        h2 {
            font-size: var(--text-xl);
            margin-bottom: 20px;
        }
        
        h3 {
            font-size: var(--text-lg);
        }
        
        .now-playing {
            text-align: center;
            padding: 20px;
        }
        
        .album-cover {
            width: 250px;
            height: 250px;
            margin: 20px auto;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .album-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            opacity: 0.3;
            z-index: 1;
        }
        
        .album-cover:hover {
            transform: scale(1.03);
        }
        
        .track-info {
            margin: 20px 0;
        }
        
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 25px 0;
            cursor: pointer;
        }
        
        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-accent), var(--secondary-accent));
            border-radius: 3px;
            transition: width 0.1s linear;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: var(--text-sm);
            opacity: 0.8;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .play-pause {
            background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
            width: 70px;
            height: 70px;
        }
        
        .playlist-section {
            padding: 20px;
        }
        
        .playlist {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .track-info-container {
            flex: 1;
        }
        
        .track-title {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .track-artist {
            font-size: var(--text-sm);
            opacity: 0.8;
        }
        
        .track-duration {
            opacity: 0.7;
        }
        
        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        
        .playlist::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .playlist::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        .playlist::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .volume-slider {
            width: 100px;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-accent);
            cursor: pointer;
        }
        
        .stellar-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
        
        .file-input-container {
            margin: 20px 0;
            text-align: center;
        }
        
        .file-input-label {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        
        .file-input-label:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        #file-input {
            display: none;
        }
        
        .format-support {
            text-align: center;
            margin-top: 10px;
            font-size: var(--text-sm);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="stellar-bg" id="stellar-bg"></div>
    
    <audio id="audio-player"></audio>
    
    <div class="glass-panel">
        <div class="player-container">
            <div class="now-playing">
                <h2>Now Playing</h2>
                <div class="album-cover" id="album-cover">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center;">
                        <i class="ti ti-music" style="font-size: 48px;"></i>
                        <p>No track selected</p>
                    </div>
                </div>
                <div class="track-info">
                    <h3 id="now-playing-title">Select a track</h3>
                    <p id="now-playing-artist">Artist</p>
                </div>
                
                <div class="progress-container" id="progress-bar-container">
                    <div class="progress" id="progress-bar"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
                
                <div class="controls">
                    <button class="control-btn" onclick="player.prevTrack()">
                        <i class="ti ti-player-skip-back"></i>
                    </button>
                    <button class="control-btn play-pause" onclick="player.playPause()">
                        <i class="ti" id="play-icon"></i>
                    </button>
                    <button class="control-btn" onclick="player.nextTrack()">
                        <i class="ti ti-player-skip-forward"></i>
                    </button>
                </div>
                
                <div class="volume-control">
                    <i class="ti ti-volume"></i>
                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
                    <i class="ti ti-volume-3"></i>
                </div>
            </div>
            
            <div class="playlist-section">
                <h2>Music Library</h2>
                
                <div class="file-input-container">
                    <label for="file-input" class="file-input-label">
                        <i class="ti ti-folder"></i> Select Music Directory
                    </label>
                    <input type="file" id="file-input" webkitdirectory directory multiple>
                    <div class="format-support">Supports: MP3, FLAC, WAV, OGG, AAC, M4A</div>
                </div>
                
                <div class="playlist" id="playlist">
                    <div class="playlist-item" style="text-align: center; opacity: 0.7;">
                        Select a music directory to load your tracks
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class MusicPlayer {
            constructor() {
                this.audio = document.getElementById('audio-player');
                this.tracks = [];
                this.currentTrackIndex = 0;
                this.isPlaying = false;
                this.progress = 0;
                this.currentTime = 0;
                this.duration = 0;
                
                this.audio.volume = 0.7;
                
                this.audio.addEventListener('ended', () => this.nextTrack());
                this.audio.addEventListener('timeupdate', () => this.updateProgress());
                this.audio.addEventListener('loadedmetadata', () => this.updateDuration());
                
                document.getElementById('volume-slider').addEventListener('input', (e) => {
                    this.audio.volume = e.target.value;
                });
                
                document.getElementById('file-input').addEventListener('change', (e) => {
                    this.handleFileSelection(e);
                });
                
                document.getElementById('progress-bar-container').addEventListener('click', (e) => this.seek(e));
                
                this.createStellarBackground();
                this.updatePlayButton();
            }
            
            createStellarBackground() {
                const container = document.getElementById('stellar-bg');
                const starCount = Math.floor(window.innerWidth * window.innerHeight / 5000);
                
                for (let i = 0; i < starCount; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    
                    const size = Math.random() * 3;
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.top = `${Math.random() * 100}%`;
                    
                    const duration = 5 + Math.random() * 10;
                    star.style.animationDuration = `${duration}s`;
                    star.style.animationDelay = `-${Math.random() * duration}s`;
                    
                    container.appendChild(star);
                }
            }
            
            handleFileSelection(event) {
                const files = Array.from(event.target.files);
                this.tracks = files
                    .filter(file => {
                        const extension = file.name.split('.').pop().toLowerCase();
                        return ['mp3', 'flac', 'wav', 'ogg', 'aac', 'm4a'].includes(extension);
                    })
                    .map(file => {
                        return {
                            file: file,
                            name: file.name.replace(/\.[^/.]+$/, ""), // Remove extension
                            path: URL.createObjectURL(file)
                        };
                    });
                
                if (this.tracks.length > 0) {
                    this.renderPlaylist();
                    this.loadTrack(0);
                } else {
                    alert('No supported audio files found. Please select a directory with audio files.');
                }
            }
            
            loadTrack(index) {
                if (index >= 0 && index < this.tracks.length) {
                    this.currentTrackIndex = index;
                    const track = this.tracks[index];
                    this.audio.src = track.path;
                    
                    this.updatePlayerDisplay(track.name);
                    
                    if (this.isPlaying) {
                        this.audio.play().catch(error => {
                            console.error("Playback failed:", error);
                        });
                    }
                }
            }
            
            playPause() {
                if (this.tracks.length === 0) {
                    alert('Please select a music directory first.');
                    return;
                }
                
                if (this.isPlaying) {
                    this.audio.pause();
                } else {
                    this.audio.play().catch(error => {
                        console.error("Playback failed:", error);
                    });
                }
                this.isPlaying = !this.isPlaying;
                this.updatePlayButton();
            }
            
            nextTrack() {
                if (this.tracks.length === 0) return;
                
                const nextIndex = (this.currentTrackIndex + 1) % this.tracks.length;
                this.loadTrack(nextIndex);
                if (this.isPlaying) {
                    this.audio.play();
                }
            }
            
            prevTrack() {
                if (this.tracks.length === 0) return;
                
                const prevIndex = (this.currentTrackIndex - 1 + this.tracks.length) % this.tracks.length;
                this.loadTrack(prevIndex);
                if (this.isPlaying) {
                    this.audio.play();
                }
            }
            
            updateProgress() {
                this.currentTime = this.audio.currentTime;
                this.duration = this.audio.duration || 0;
                
                if (this.duration > 0) {
                    this.progress = (this.currentTime / this.duration) * 100;
                    this.updateProgressBar();
                    this.updateTimeDisplay();
                }
            }
            
            updateDuration() {
                this.duration = this.audio.duration;
                this.updateTimeDisplay();
            }
            
            updateTimeDisplay() {
                document.getElementById('current-time').textContent = this.formatTime(this.currentTime);
                document.getElementById('total-time').textContent = this.formatTime(this.duration);
            }
            
            formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${minutes}:${secs.toString().padStart(2, '0')}`;
            }
            
            seek(event) {
                if (this.tracks.length === 0) return;
                
                const progressBar = event.currentTarget;
                const clickPosition = event.offsetX;
                const width = progressBar.offsetWidth;
                const percent = clickPosition / width;
                this.audio.currentTime = percent * this.duration;
            }
            
            updatePlayerDisplay(title) {
                document.getElementById('now-playing-title').textContent = title;
                document.getElementById('now-playing-artist').textContent = "Local File";
            }
            
            updatePlayButton() {
                const playIcon = document.getElementById('play-icon');
                if (this.isPlaying) {
                    playIcon.classList.remove('ti-player-play');
                    playIcon.classList.add('ti-player-pause');
                } else {
                    playIcon.classList.remove('ti-player-pause');
                    playIcon.classList.add('ti-player-play');
                }
            }
            
            updateProgressBar() {
                document.getElementById('progress-bar').style.width = `${this.progress}%`;
            }
            
            renderPlaylist() {
                const playlistElement = document.getElementById('playlist');
                playlistElement.innerHTML = '';
                
                this.tracks.forEach((track, index) => {
                    const trackElement = document.createElement('div');
                    trackElement.className = 'playlist-item';
                    trackElement.innerHTML = `
                        <div class="track-info-container">
                            <div class="track-title">${track.name}</div>
                            <div class="track-artist">Local File</div>
                        </div>
                        <div class="track-duration">--:--</div>
                    `;
                    
                    // Get duration once metadata is loaded
                    const audio = new Audio();
                    audio.src = track.path;
                    audio.addEventListener('loadedmetadata', () => {
                        const durationElem = trackElement.querySelector('.track-duration');
                        durationElem.textContent = this.formatTime(audio.duration);
                    });
                    
                    trackElement.addEventListener('click', () => {
                        this.loadTrack(index);
                        if (!this.isPlaying) {
                            this.isPlaying = true;
                            this.updatePlayButton();
                            this.audio.play();
                        }
                    });
                    
                    playlistElement.appendChild(trackElement);
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            window.player = new MusicPlayer();
        });
    </script>
</body>
</html>
